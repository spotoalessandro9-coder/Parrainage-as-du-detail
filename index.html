<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'As Du Détail - Gestion RDV</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background-color: #0f1115; color: #f0f0f0; display: flex; justify-content: center; padding: 20px; }
    .container { width: 100%; max-width: 480px; background: #181b20; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #2a2e37; }
    
    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { font-weight: 700; color: #d4af37; font-size: 24px; letter-spacing: 1px; }
    .header p { font-size: 12px; color: #8a8f99; margin-top: 4px; font-style: italic; }

    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #cfd3da; }
    input, select { width: 100%; padding: 12px 14px; background: #22262f; border: 1px solid #323846; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    input:focus, select:focus { border-color: #d4af37; }

    .checkbox-group { display: grid; gap: 8px; margin-top: 6px; }
    .checkbox-item { display: flex; align-items: center; gap: 10px; background: #22262f; padding: 10px; border-radius: 8px; border: 1px solid #323846; }
    .checkbox-item input { width: auto; cursor: pointer; }
    .checkbox-item label { margin-bottom: 0; cursor: pointer; font-weight: 400; font-size: 13px; }

    .actions { display: flex; gap: 12px; margin-top: 25px; }
    .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; font-size: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-confirm { background: #d4af37; color: #111; }
    .btn-confirm:hover { background: #b8962d; }
    .btn-reminder { background: #2b313d; color: #fff; border: 1px solid #404859; }
    .btn-reminder:hover { background: #384050; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>L'AS DU DÉTAIL</h1>
    <p>Plus qu’un nettoyage, une signature</p>
  </div>

  <form id="bookingForm">
    <div class="form-group">
      <label>Téléphone du client</label>
      <input type="tel" id="phone" placeholder="ex: 0612345678" required>
    </div>

    <div class="form-group">
      <label>Nom du client</label>
      <input type="text" id="clientName" placeholder="ex: Marc Dupont" required>
    </div>

    <div class="form-group">
      <label>Prestation</label>
      <select id="service">
        <option value="Nettoyage Intérieur">Nettoyage Intérieur</option>
        <option value="Nettoyage Extérieur">Nettoyage Extérieur</option>
        <option value="Formule Complète">Formule Complète</option>
        <option value="Rénovation / Polissage">Rénovation / Polissage</option>
      </select>
    </div>

    <div class="form-group">
      <label>Formule</label>
      <select id="subscription">
        <option value="Prestation à l'acte">À l'acte</option>
        <option value="Abonnement Mensuel">Abonnement Mensuel</option>
        <option value="Abonnement Trimestriel">Abonnement Trimestriel</option>
      </select>
    </div>

    <div class="form-group">
      <label>Lieu d'intervention</label>
      <input type="text" id="location" placeholder="Adresse ou 'À l'atelier'" required>
    </div>

    <div class="form-group">
      <label>Suppléments</label>
      <div class="checkbox-group">
        <div class="checkbox-item">
          <input type="checkbox" id="supp1" value="Poils d'animaux">
          <label for="supp1">Poils d'animaux</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="supp2" value="Traitement Cuir">
          <label for="supp2">Traitement Cuir</label>
        </div>
        <div class="checkbox-item">
          <input type="checkbox" id="supp3" value="Protection Céramique">
          <label for="supp3">Protection Céramique</label>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>Code / Nom du Parrain</label>
      <input type="text" id="referral" placeholder="Optionnel">
    </div>

    <div class="form-group">
      <label>Date & Heure du RDV</label>
      <input type="datetime-local" id="datetime" required>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-confirm" onclick="sendSMS('confirmation')">📩 Confirmation</button>
      <button type="button" class="btn btn-reminder" onclick="sendSMS('reminder')">🔔 Rappel</button>
    </div>
  </form>
</div>

<script>
function sendSMS(type) {
  const phone = document.getElementById('phone').value;
  const clientName = document.getElementById('clientName').value;
  const service = document.getElementById('service').value;
  const location = document.getElementById('location').value;
  
  const rawDatetime = document.getElementById('datetime').value;
  let formattedDatetime = rawDatetime;
  if (rawDatetime) {
    const [datePart, timePart] = rawDatetime.split('T');
    const [year, month, day] = datePart.split('-');
    formattedDatetime = `${day}/${month}/${year} à ${timePart}`;
  }

  let message = "";

  if (type === 'confirmation') {
    const subscription = document.getElementById('subscription').value;
    const referral = document.getElementById('referral').value || 'Aucun';
    
    let supplements = [];
    if (document.getElementById('supp1').checked) supplements.push("Poils d'animaux");
    if (document.getElementById('supp2').checked) supplements.push("Traitement Cuir");
    if (document.getElementById('supp3').checked) supplements.push("Protection Céramique");
    const suppText = supplements.length > 0 ? supplements.join(', ') : 'Aucun';

    message = 
`✨ CONFIRMATION DE RENDEZ-VOUS ✨\n\n` +
`Bonjour ${clientName},\n\n` +
`Votre rendez-vous est bien confirmé ! Voici le récapitulatif de votre réservation :\n\n` +
`🛠️ Prestation : ${service}\n` +
`💳 Formule : ${subscription}\n` +
`📍 Lieu : ${location}\n` +
`➕ Suppléments : ${suppText}\n` +
`🎁 Parrainage : ${referral}\n\n` +
`📅 Date & Heure : ${formattedDatetime}\n\n` +
`Merci pour votre confiance et à très bientôt ! 👋\n\n` +
`—\n` +
`Alex\n` +
`L'As Du Détail ; plus qu’un nettoyage , une signature`;

  } else if (type === 'reminder') {
    message = 
`🔔 RAPPEL DE RENDEZ-VOUS 🔔\n\n` +
`Bonjour ${clientName},\n\n` +
`Petit rappel pour votre rendez-vous prévu très prochainement :\n\n` +
`🛠️ Prestation : ${service}\n` +
`📍 Lieu : ${location}\n` +
`📅 Date & Heure : ${formattedDatetime}\n\n` +
`Merci de nous prévenir en cas d'imprévu. À très vite ! 👋\n\n` +
`—\n` +
`Alex\n` +
`L'As Du Détail ; plus qu’un nettoyage , une signature`;
  }

  const isiOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const separator = isiOS ? '&' : '?';
  window.location.href = `sms:${phone}${separator}body=${encodeURIComponent(message)}`;
}
</script>

</body>
</html>
