<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'As du Détail — Parrainage</title>
  <style>
    :root {
      --bg: #FFFFFF;
      --card-bg: #18181B;
      --card-border: #27272A;
      --gold: #C5A059;
      --text-light: #F4F4F5;
      --text-muted: #A1A1AA;
      --text-dark: #09090B;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-dark); padding: 16px; max-width: 600px; margin: 0 auto; }
    
    /* Header */
    header { text-align: center; margin-bottom: 24px; padding-top: 12px; }
    header h1 { font-size: 1.5rem; letter-spacing: 1px; text-transform: uppercase; font-weight: 700; }
    header p { color: #666; font-size: 0.85rem; margin-top: 4px; }
    
    /* Controls & Search */
    .controls { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"] { flex: 1; padding: 12px 16px; border: 1px solid #E4E4E7; border-radius: 8px; font-size: 0.95rem; outline: none; }
    input[type="text"]:focus { border-color: var(--gold); }
    .btn-add { background: var(--card-bg); color: var(--gold); border: 1px solid var(--gold); padding: 0 16px; border-radius: 8px; font-weight: 600; cursor: pointer; }

    /* Client Cards */
    .client-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 16px; color: var(--text-light); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .client-name { font-size: 1.1rem; font-weight: 600; }
    .client-phone { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    .discount-badge { background: rgba(197, 160, 89, 0.15); color: var(--gold); border: 1px solid var(--gold); font-size: 1.1rem; font-weight: 700; padding: 6px 12px; border-radius: 20px; }
    
    .referral-box { background: #09090B; padding: 10px 12px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; margin-bottom: 12px; border: 1px solid #27272A; }
    .copy-btn { background: transparent; border: none; color: var(--gold); font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    
    /* Actions */
    .actions { display: flex; flex-direction: column; gap: 8px; }
    .btn-action { width: 100%; padding: 12px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; display: flex; justify-content: center; align-items: center; text-decoration: none; }
    .btn-actif { background: var(--gold); color: #000; }
    .btn-credit { background: #27272A; color: var(--gold); border: 1px solid var(--gold); }
    .btn-apply { background: #27272A; color: var(--text-light); border: 1px solid #3F3F46; }
    
    /* Modal */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: var(--bg); padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; }
    .modal-content h2 { margin-bottom: 16px; font-size: 1.2rem; }
    .modal-content input { width: 100%; margin-bottom: 12px; }
    .modal-btns { display: flex; gap: 8px; margin-top: 8px; }
    .btn-cancel { background: #E4E4E7; border: none; padding: 10px; flex: 1; border-radius: 6px; font-weight: 600; }
    .btn-save { background: var(--card-bg); color: var(--gold); border: none; padding: 10px; flex: 1; border-radius: 6px; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>L'As du Détail</h1>
    <p>Gestionnaire de Parrainage</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Rechercher un client ou code..." oninput="renderClients()">
    <button class="btn-add" onclick="openModal()">+ Client</button>
  </div>

  <div id="clientList"></div>

  <!-- Modal Nouveau Client -->
  <div class="modal" id="clientModal">
    <div class="modal-content">
      <h2>Nouveau Client</h2>
      <input type="text" id="newPrenom" placeholder="Prénom">
      <input type="text" id="newNom" placeholder="Nom">
      <input type="text" id="newTel" placeholder="Téléphone (ex: 0499123456)">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Annuler</button>
        <button class="btn-save" onclick="saveClient()">Enregistrer</button>
      </div>
    </div>
  </div>

  <script>
    let clients = JSON.parse(localStorage.getItem('as_details_clients')) || [
      { id: '1', prenom: 'Alex', nom: 'Demo', tel: '0499000000', code: 'ALEX10', statut: 'Inactif', parrainagesNotifies: 0, discount: 0 }
    ];

    function saveToStorage() {
      localStorage.setItem('as_details_clients', JSON.stringify(clients));
      renderClients();
    }

    function renderClients() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('clientList');
      list.innerHTML = '';

      const filtered = clients.filter(c => 
        c.prenom.toLowerCase().includes(search) || 
        c.nom.toLowerCase().includes(search) || 
        c.code.toLowerCase().includes(search) ||
        c.tel.includes(search)
      );

      filtered.forEach(c => {
        const card = document.createElement('div');
        card.className = 'client-card';
        card.innerHTML = `
          <div class="card-header">
            <div>
              <div class="client-name">${c.prenom} ${c.nom}</div>
              <div class="client-phone">${c.tel}</div>
            </div>
            <div class="discount-badge">${c.discount}%</div>
          </div>
          
          <div class="referral-box">
            <span>Code: <strong>${c.code}</strong></span>
            <button class="copy-btn" onclick="copyCode('${c.code}')">Copier</button>
          </div>

          <div class="actions">
            ${c.statut === 'Inactif' ? `
              <a href="sms:${c.tel}?body=Bonjour ${c.prenom}, votre compte client chez L'As du Détail est maintenant actif ! Vous disposez actuellement de ${c.discount}% de réduction cumulée." 
                 class="btn-action btn-actif" onclick="activateAccount('${c.id}')">
                1. Compte Actif
              </a>
            ` : ''}

            ${c.parrainagesNotifies > 0 ? `
              <a href="sms:${c.tel}?body=Félicitations ${c.prenom} ! Un nouveau parrainage vient d'être validé. 10% de réduction viennent d'être ajoutés à votre compte. Vous avez désormais ${c.discount}% de réduction au total chez L'As du Détail !" 
                 class="btn-action btn-credit" onclick="creditReferral('${c.id}')">
                2. +10% Crédité (${c.parrainagesNotifies})
              </a>
            ` : ''}

            ${c.discount > 0 ? `
              <a href="sms:${c.tel}?body=Bonjour ${c.prenom}, votre réduction de ${c.discount}% a bien été appliquée sur votre prestation aujourd'hui chez L'As du Détail. Merci pour votre confiance !" 
                 class="btn-action btn-apply">
                3. Réduction appliquée
              </a>
            ` : ''}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function copyCode(code) {
      navigator.clipboard.writeText(code);
      alert('Code parrain copié : ' + code);
    }

    function activateAccount(id) {
      const client = clients.find(c => c.id === id);
      if (client) { client.statut = 'Actif'; saveToStorage(); }
    }

    function creditReferral(id) {
      const client = clients.find(c => c.id === id);
      if (client && client.parrainagesNotifies > 0) { 
        client.parrainagesNotifies -= 1; 
        saveToStorage(); 
      }
    }

    function openModal() { document.getElementById('clientModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('clientModal').style.display = 'none'; }

    function saveClient() {
      const prenom = document.getElementById('newPrenom').value;
      const nom = document.getElementById('newNom').value;
      const tel = document.getElementById('newTel').value;

      if (!prenom || !tel) { alert('Prénom et Téléphone requis'); return; }

      const code = (prenom.substring(0,3) + Math.floor(100 + Math.random() * 900)).toUpperCase();
      clients.push({
        id: Date.now().toString(),
        prenom, nom, tel, code,
        statut: 'Inactif',
        parrainagesNotifies: 0,
        discount: 0
      });

      saveToStorage();
      closeModal();
      document.getElementById('newPrenom').value = '';
      document.getElementById('newNom').value = '';
      document.getElementById('newTel').value = '';
    }

    renderClients();
  </script>
</body>
</html>
