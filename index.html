<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'As Du Détail - Prise de Rendez-vous</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: '#10b981'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-lg bg-gray-800 rounded-2xl shadow-xl border border-gray-700 p-6 space-y-6">
    
    <!-- En-tête -->
    <div class="text-center space-y-2">
      <h1 class="text-2xl font-bold tracking-tight text-white">L'As Du Détail</h1>
      <p class="text-xs text-gray-400 italic">Plus qu’un nettoyage, une signature</p>
    </div>

    <!-- Formulaire -->
    <form id="bookingForm" class="space-y-4">
      
      <!-- Infos Client -->
      <div>
        <label class="block text-sm font-medium text-gray-300">Nom & Prénom</label>
        <input type="text" id="clientName" required class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-300">Téléphone (SMS)</label>
        <input type="tel" id="clientPhone" placeholder="04XXXXXXXX" required class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
      </div>

      <!-- Service / Prestation -->
      <div>
        <label class="block text-sm font-medium text-gray-300">Prestation</label>
        <select id="serviceType" class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
          <option value="Nettoyage Intérieur">Nettoyage Intérieur</option>
          <option value="Nettoyage Extérieur">Nettoyage Extérieur</option>
          <option value="Formule Complète">Formule Complète</option>
          <option value="Rénovation & Polissage">Rénovation & Polissage</option>
          <option value="Protection Céramique SiO2">Protection Céramique SiO2</option>
        </select>
      </div>

      <!-- Abonnement -->
      <div>
        <label class="block text-sm font-medium text-gray-300">Abonnement / Fréquence</label>
        <select id="subscriptionType" class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
          <option value="Unique">Prestation Unique</option>
          <option value="Mensuel">Abonnement Mensuel</option>
          <option value="Trimestriel">Abonnement Trimestriel</option>
        </select>
      </div>

      <!-- Lieu -->
      <div>
        <label class="block text-sm font-medium text-gray-300">Lieu d'intervention</label>
        <select id="locationType" class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
          <option value="Atelier (Waremme)">Atelier (Waremme)</option>
          <option value="À Domicile">À Domicile</option>
        </select>
      </div>

      <!-- Suppléments -->
      <div>
        <label class="block text-sm font-medium text-gray-300">Suppléments (Optionnel)</label>
        <input type="text" id="supplements" placeholder="ex: Traitement Ozone, Poils d'animaux..." class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
      </div>

      <!-- Code Parrainage -->
      <div>
        <label class="block text-sm font-medium text-gray-300">Code Parrainage (Optionnel)</label>
        <input type="text" id="referralCode" placeholder="Code parrain" class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
      </div>

      <!-- Date et Heure -->
      <div>
        <label class="block text-sm font-medium text-gray-300">Date et Heure du RDV</label>
        <input type="datetime-local" id="appointmentDate" required class="mt-1 w-full rounded-lg bg-gray-700 border-gray-600 text-white p-2.5 focus:ring-brand focus:border-brand">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-3 rounded-lg transition-colors">
        Enregistrer & Envoyer SMS
      </button>
    </form>

    <!-- Zone de statut -->
    <div id="statusMessage" class="hidden text-center text-sm p-3 rounded-lg"></div>

  </div>

  <script>
    // Configuration Supabase intégrée
    const SUPABASE_URL = "https://churvkmecgypblfrknyr.supabase.co";
    const SUPABASE_KEY = "EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNodXJ2a21lY2d5cGJsZnJrbnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg5NDEyMzUsImV4cCI6MjEwNDUxNzIzNX0.wgryFazsmV-6gMHiAb97faOeKH_p6TJ3v2dxO0-Nf1c";
    
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      const statusMessage = document.getElementById('statusMessage');
      
      submitBtn.disabled = true;
      submitBtn.innerText = "Enregistrement...";

      const name = document.getElementById('clientName').value;
      const phone = document.getElementById('clientPhone').value;
      const service = document.getElementById('serviceType').value;
      const subscription = document.getElementById('subscriptionType').value;
      const location = document.getElementById('locationType').value;
      const supplements = document.getElementById('supplements').value;
      const referral = document.getElementById('referralCode').value;
      const date = document.getElementById('appointmentDate').value;

      try {
        // 1. Enregistrement / recherche du client
        let { data: client, error: clientErr } = await db
          .from('clients')
          .insert([{ name, phone, referral }])
          .select()
          .single();

        if (clientErr) throw clientErr;

        // 2. Enregistrement du rendez-vous
        const { error: apptErr } = await db
          .from('appointments')
          .insert([{
            client_id: client.id,
            service,
            subscription,
            location,
            supplements,
            appointment_date: date
          }]);

        if (apptErr) throw apptErr;

        // Affichage succès
        statusMessage.className = "text-center text-sm p-3 rounded-lg bg-emerald-900/50 text-emerald-300 border border-emerald-700";
        statusMessage.innerText = "Rendez-vous enregistré ! Ouverture des SMS...";
        statusMessage.classList.remove('hidden');

        // 3. Préparation et ouverture du SMS automatique
        const formattedDate = new Date(date).toLocaleString('fr-BE', { 
          dateStyle: 'full', 
          timeStyle: 'short' 
        });

        const smsBody = encodeURIComponent(
          `Bonjour ${name},\n\n` +
          `Votre rendez-vous chez L'As Du Détail est confirmé pour le ${formattedDate}.\n\n` +
          `Prestation : ${service}\n` +
          `Lieu : ${location}\n\n` +
          `Merci pour votre confiance !\n` +
          `L'As Du Détail — Plus qu’un nettoyage, une signature`
        );

        // Ouvre l'application SMS du téléphone avec le numéro et le message préremplis
        window.location.href = `sms:${phone}?body=${smsBody}`;

      } catch (err) {
        console.error(err);
        statusMessage.className = "text-center text-sm p-3 rounded-lg bg-red-900/50 text-red-300 border border-red-700";
        statusMessage.innerText = "Erreur lors de l'enregistrement. Veuillez réassocier Supabase.";
        statusMessage.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Enregistrer & Envoyer SMS";
      }
    });
  </script>
</body>
</html>
