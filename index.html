<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>L'As du Détail — Parrainage</title>
  <style>
    :root {
      --bg: #09090B;
      --card-bg: #18181B;
      --card-border: #27272A;
      --gold: #C5A059;
      --text-light: #F4F4F5;
      --text-muted: #A1A1AA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-light); padding: 16px; max-width: 600px; margin: 0 auto; min-height: 100vh; }
    
    /* Header */
    header { text-align: center; margin-bottom: 24px; padding-top: 12px; }
    header h1 { font-size: 1.6rem; letter-spacing: 2px; text-transform: uppercase; font-weight: 800; color: #FFF; }
    header p { color: var(--gold); font-size: 0.8rem; font-style: italic; margin-top: 6px; letter-spacing: 0.5px; }
    
    /* Controls & Search */
    .controls { display: flex; gap: 8px; margin-bottom: 20px; }
    input[type="text"], input[type="tel"], input[type="number"], select { 
      flex: 1; padding: 14px 16px; background: #121214; border: 1px solid var(--card-border); 
      border-radius: 10px; font-size: 0.95rem; color: #FFF; outline: none; width: 100%;
    }
    input[type="text"]:focus, input[type="tel"]:focus, input[type="number"]:focus, select:focus { border-color: var(--gold); }
    .btn-add { background: var(--gold); color: #000; border: none; padding: 0 18px; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 0.9rem; }

    /* Client Cards */
    .client-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); cursor: pointer; transition: border-color 0.2s; }
    .client-card:active { border-color: var(--gold); }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .client-name { font-size: 1.2rem; font-weight: 700; color: #FFF; }
    .client-phone { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    .status-pill { display: inline-block; font-size: 0.7rem; padding: 2px 8px; border-radius: 10px; font-weight: 600; text-transform: uppercase; margin-top: 4px; }
    .status-inactif { background: rgba(239, 68, 68, 0.2); color: #EF4444; border: 1px solid #EF4444; }
    .status-actif { background: rgba(34, 197, 94, 0.2); color: #22C55E; border: 1px solid #22C55E; }

    .discount-badge { background: rgba(197, 160, 89, 0.15); color: var(--gold); border: 1px solid var(--gold); font-size: 1.3rem; font-weight: 800; padding: 8px 14px; border-radius: 14px; text-align: center; }
    .discount-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 500; display: block; text-transform: uppercase; }

    .referral-box { background: #09090B; padding: 12px 14px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; margin-bottom: 16px; border: 1px solid var(--card-border); }
    .copy-btn { background: rgba(197, 160, 89, 0.2); border: 1px solid var(--gold); color: var(--gold); font-weight: 600; cursor: pointer; font-size: 0.8rem; padding: 4px 10px; border-radius: 6px; }
    
    /* Actions SMS */
    .actions-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; font-weight: 700; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
    .btn-action { width: 100%; padding: 14px; border-radius: 10px; font-weight: 700; font-size: 0.9rem; border: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; text-decoration: none; box-sizing: border-box; }
    .btn-actif { background: var(--gold); color: #000; }
    .btn-credit { background: #27272A; color: var(--gold); border: 1px solid var(--gold); }
    .btn-apply { background: #27272A; color: #FFF; border: 1px solid #3F3F46; }
    
    /* Modals */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 16px; z-index: 100; overflow-y: auto; }
    .modal-content { background: var(--card-bg); padding: 24px; border-radius: 16px; width: 100%; max-width: 440px; border: 1px solid var(--card-border); margin: auto; }
    .modal-content h2 { margin-bottom: 16px; font-size: 1.3rem; color: #FFF; text-align: center; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
    .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
    .btn-cancel { background: #27272A; color: #FFF; border: none; padding: 12px; flex: 1; border-radius: 8px; font-weight: 600; }
    .btn-save { background: var(--gold); color: #000; border: none; padding: 12px; flex: 1; border-radius: 8px; font-weight: 700; }
    
    /* Fiche Detail */
    .detail-hero { text-align: center; margin-bottom: 20px; }
    .detail-big-discount { font-size: 3rem; font-weight: 900; color: var(--gold); }
    .detail-list { background: #09090B; border-radius: 10px; padding: 12px; border: 1px solid var(--card-border); margin-top: 10px; }
    .detail-item { font-size: 0.85rem; padding: 6px 0; border-bottom: 1px solid #18181B; display: flex; justify-content: space-between; }
    .detail-item:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <header>
    <h1>L'As du Détail</h1>
    <p>las du détail ; plus qu’un nettoyage , une signature</p>
  </header>

  <div class="controls">
    <input type="text" id="searchInput" placeholder="Rechercher client, tel, code..." oninput="renderClients()">
    <button class="btn-add" onclick="openAddModal()">+ Client</button>
  </div>

  <div id="clientList"></div>

  <!-- Modal Nouveau Client avec choix du parrain -->
  <div class="modal" id="addModal">
    <div class="modal-content">
      <h2>Nouveau Client</h2>
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="newPrenom" placeholder="Ex: Jean">
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="newNom" placeholder="Ex: Dupont">
      </div>
      <div class="form-group">
        <label>Téléphone</label>
        <input type="tel" id="newTel" placeholder="Ex: 0499123456">
      </div>
      <div class="form-group">
        <label>Parrain (Optionnel)</label>
        <select id="newParrainSelect">
          <option value="">-- Aucun parrain --</option>
        </select>
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeAddModal()">Annuler</button>
        <button class="btn-save" onclick="saveClient()">Enregistrer (+10% au parrain)</button>
      </div>
    </div>
  </div>

  <!-- Modal Fiche Client Détaillée -->
  <div class="modal" id="detailModal">
    <div class="modal-content">
      <div class="detail-hero">
        <div class="detail-big-discount" id="detDiscount">0%</div>
        <h2 id="detName" style="margin: 0;">-</h2>
        <p id="detPhone" style="color: var(--text-muted); font-size: 0.9rem;">-</p>
      </div>

      <div class="referral-box">
        <span>Code Parrain : <strong id="detCode">-</strong></span>
        <button class="copy-btn" id="detCopyBtn">Copier</button>
      </div>

      <div class="form-group">
        <label>Choix manuel du % à créditer</label>
        <div style="display: flex; gap: 8px;">
          <select id="creditPercentSelect">
            <option value="5">5%</option>
            <option value="10" selected>10%</option>
            <option value="15">15%</option>
            <option value="20">20%</option>
          </select>
          <button class="btn-save" style="flex: initial; padding: 0 16px;" onclick="addCustomDiscount()">Ajouter %</button>
        </div>
      </div>

      <div class="form-group">
        <label>Filleuls apportés</label>
        <div class="detail-list" id="detFilleulsList">
          <div class="detail-item"><span>Aucun filleul pour l'instant</span></div>
        </div>
      </div>

      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeDetailModal()">Fermer</button>
      </div>
    </div>
  </div>

  <!-- Modal Utilisation Réduction Partielle -->
  <div class="modal" id="useDiscountModal">
    <div class="modal-content">
      <h2>Utiliser une Réduction</h2>
      <p id="useDiscountInfo" style="font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-bottom: 16px;"></p>
      <div class="form-group">
        <label>Pourcentage à utiliser aujourd'hui (%)</label>
        <input type="number" id="useDiscountAmount" min="1" placeholder="Ex: 50">
      </div>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeUseDiscountModal()">Annuler</button>
        <button class="btn-save" onclick="confirmApplyDiscount()">Valider & SMS ➔</button>
      </div>
    </div>
  </div>

  <script>
    let clients = JSON.parse(localStorage.getItem('as_details_clients')) || [
      { id: '1', prenom: 'Alex', nom: 'Demo', tel: '0499000000', code: 'ALEX10', statut: 'Inactif', parrainagesPending: 1, discount: 60, filleuls: [] }
    ];

    let currentDetailId = null;
    let currentUseDiscountId = null;

    function saveToStorage() {
      localStorage.setItem('as_details_clients', JSON.stringify(clients));
      renderClients();
    }

    function renderClients() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const list = document.getElementById('clientList');
      list.innerHTML = '';

      const filtered = clients.filter(c => 
        c.prenom.toLowerCase().includes(search) || 
        c.nom.toLowerCase().includes(search) || 
        c.code.toLowerCase().includes(search) ||
        c.tel.includes(search)
      );

      filtered.forEach(c => {
        const card = document.createElement('div');
        card.className = 'client-card';
        
        const msgActif = encodeURIComponent(`Bonjour ${c.prenom}, votre compte client chez L'As du Détail est maintenant actif ! Vous disposez actuellement de ${c.discount}% de réduction cumulée.`);
        const msgCredit = encodeURIComponent(`Félicitations ${c.prenom} ! Un nouveau parrainage vient d'être validé. De la réduction vient d'être ajoutée à votre compte. Vous avez désormais ${c.discount}% de réduction au total chez L'As du Détail !`);

        card.innerHTML = `
          <div class="card-header" onclick="openDetailModal('${c.id}')">
            <div>
              <div class="client-name">${c.prenom} ${c.nom}</div>
              <div class="client-phone">${c.tel}</div>
              <span class="status-pill ${c.statut === 'Actif' ? 'status-actif' : 'status-inactif'}">${c.statut}</span>
            </div>
            <div class="discount-badge">
              ${c.discount}%
              <span class="discount-label">Réduction</span>
            </div>
          </div>
          
          <div class="referral-box" onclick="event.stopPropagation()">
            <span>Code Parrain : <strong>${c.code}</strong></span>
            <button class="copy-btn" onclick="copyCode('${c.code}')">Copier</button>
          </div>

          <div class="actions-title">Actions SMS Automatiques</div>
          <div class="actions" onclick="event.stopPropagation()">
            ${c.statut === 'Inactif' ? `
              <a href="sms:${c.tel}?body=${msgActif}" 
                 class="btn-action btn-actif" onclick="activateAccount('${c.id}')">
                <span>1. Activer le compte</span>
                <span>SMS ➔</span>
              </a>
            ` : ''}

            ${c.parrainagesPending > 0 ? `
              <a href="sms:${c.tel}?body=${msgCredit}" 
                 class="btn-action btn-credit" onclick="creditReferral('${c.id}')">
                <span>2. Créditer (${c.parrainagesPending} en attente)</span>
                <span>SMS ➔</span>
              </a>
            ` : ''}

            ${c.discount > 0 ? `
              <button class="btn-action btn-apply" onclick="openUseDiscountModal('${c.id}')">
                <span>3. Utiliser réduction (Disponible: ${c.discount}%)</span>
                <span>Choix ➔</span>
              </button>
            ` : ''}
          </div>
        `;
        list.appendChild(card);
      });
    }

    function copyCode(code) {
      navigator.clipboard.writeText(code);
      alert('Code parrain copié : ' + code);
    }

    function activateAccount(id) {
      const client = clients.find(c => c.id === id);
      if (client) { client.statut = 'Actif'; saveToStorage(); }
    }

    function creditReferral(id) {
      const client = clients.find(c => c.id === id);
      if (client && client.parrainagesPending > 0) { 
        client.parrainagesPending -= 1;
        saveToStorage(); 
      }
    }

    /* Gestion réduction partielle */
    function openUseDiscountModal(id) {
      currentUseDiscountId = id;
      const c = clients.find(item => item.id === id);
      if (!c) return;
      document.getElementById('useDiscountInfo').innerText = `${c.prenom} a actuellement ${c.discount}% de réduction disponible.`;
      document.getElementById('useDiscountAmount').value = c.discount;
      document.getElementById('useDiscountAmount').max = c.discount;
      document.getElementById('useDiscountModal').style.display = 'flex';
    }

    function closeUseDiscountModal() {
      document.getElementById('useDiscountModal').style.display = 'none';
      currentUseDiscountId = null;
    }

    function confirmApplyDiscount() {
      if (!currentUseDiscountId) return;
      const c = clients.find(item => item.id === currentUseDiscountId);
      const amountUsed = parseInt(document.getElementById('useDiscountAmount').value);

      if (isNaN(amountUsed) || amountUsed <= 0 || amountUsed > c.discount) {
        alert('Veuillez entrer une valeur valide (entre 1 et ' + c.discount + '%)');
        return;
      }

      c.discount -= amountUsed;
      saveToStorage();

      let msgBody = `Bonjour ${c.prenom}, votre réduction de ${amountUsed}% a bien été appliquée sur votre prestation aujourd'hui chez L'As du Détail.`;
      if (c.discount > 0) {
        msgBody += ` Il vous reste encore ${c.discount}% de réduction disponible pour votre prochaine visite !`;
      } else {
        msgBody += ` Merci pour votre confiance !`;
      }

      closeUseDiscountModal();
      window.location.href = `sms:${c.tel}?body=${encodeURIComponent(msgBody)}`;
    }

    /* Modal Nouveau Client */
    function openAddModal() {
      const select = document.getElementById('newParrainSelect');
      select.innerHTML = '<option value="">-- Aucun parrain --</option>';
      clients.forEach(c => {
        select.innerHTML += `<option value="${c.id}">${c.prenom} ${c.nom} (${c.code})</option>`;
      });
      document.getElementById('addModal').style.display = 'flex';
    }

    function closeAddModal() { document.getElementById('addModal').style.display = 'none'; }

    function saveClient() {
      const prenom = document.getElementById('newPrenom').value;
      const nom = document.getElementById('newNom').value;
      const tel = document.getElementById('newTel').value;
      const parrainId = document.getElementById('newParrainSelect').value;

      if (!prenom || !tel) { alert('Prénom et Téléphone requis'); return; }

      const code = (prenom.substring(0,3) + Math.floor(100 + Math.random() * 900)).toUpperCase();
      const newId = Date.now().toString();

      clients.push({
        id: newId,
        prenom, nom, tel, code,
        statut: 'Inactif',
        parrainagesPending: 0,
        discount: 0,
        filleuls: []
      });

      if (parrainId) {
        const parrain = clients.find(c => c.id === parrainId);
        if (parrain) {
          parrain.discount += 10;
          parrain.parrainagesPending += 1;
          parrain.filleuls = parrain.filleuls || [];
          parrain.filleuls.push(`${prenom} ${nom}`);
        }
      }

      saveToStorage();
      closeAddModal();
      document.getElementById('newPrenom').value = '';
      document.getElementById('newNom').value = '';
      document.getElementById('newTel').value = '';
    }

    /* Modal Fiche Client Détaillée */
    function openDetailModal(id) {
      currentDetailId = id;
      const c = clients.find(item => item.id === id);
      if (!c) return;

      document.getElementById('detName').innerText = `${c.prenom} ${c.nom}`;
      document.getElementById('detPhone').innerText = c.tel;
      document.getElementById('detDiscount').innerText = `${c.discount}%`;
      document.getElementById('detCode').innerText = c.code;
      document.getElementById('detCopyBtn').onclick = () => copyCode(c.code);

      const list = document.getElementById('detFilleulsList');
      list.innerHTML = '';
      if (c.filleuls && c.filleuls.length > 0) {
        c.filleuls.forEach(f => {
          list.innerHTML += `<div class="detail-item"><span>${f}</span><span style="color:var(--gold);">Filleul validé</span></div>`;
        });
      } else {
        list.innerHTML = '<div class="detail-item"><span>Aucun filleul enregistré</span></div>';
      }

      document.getElementById('detailModal').style.display = 'flex';
    }

    function closeDetailModal() { document.getElementById('detailModal').style.display = 'none'; }

    function addCustomDiscount() {
      if (!currentDetailId) return;
      const val = parseInt(document.getElementById('creditPercentSelect').value);
      const c = clients.find(item => item.id === currentDetailId);
      if (c) {
        c.discount += val;
        saveToStorage();
        openDetailModal(currentDetailId);
      }
    }

    renderClients();
  </script>
</body>
</html>
